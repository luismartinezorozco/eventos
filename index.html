<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | EQB Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Outfit for a modern design studio look) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eqb: {
                            orange: '#FF6400', // EQB Studio brand orange
                            dark: '#000000',
                            gray: '#1A1A1A'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Floating animation for the mascot */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Subtle pulse for the interactive hint */
        @keyframes gentlePulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-hint {
            animation: gentlePulse 2s infinite;
        }

        /* Button Glow Effects */
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.6);
            transform: translateY(-3px);
        }
        
        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Background Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 10;
        }
        
        /* Cursor interaction text */
        .mascot-container {
            cursor: pointer;
        }
    </style>
</head>
<body class="antialiased selection:bg-eqb-orange selection:text-white flex items-center justify-center min-h-screen">

    <canvas id="particles-canvas"></canvas>

    <main class="content-wrapper container mx-auto px-6 py-12 flex flex-col-reverse lg:flex-row items-center justify-between gap-12 lg:gap-24">
        
        <!-- Left Side: Text and Buttons -->
        <div class="flex-1 flex flex-col items-center lg:items-start text-center lg:text-left">
            
            <div id="parallax-text" class="relative transition-transform duration-200 ease-out">
                <h1 class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-br from-eqb-orange to-yellow-400 mb-2 drop-shadow-lg">
                    404
                </h1>
            </div>
            
            <h2 class="text-3xl md:text-4xl font-bold mb-4">
                ¡Ups! Te saliste del lienzo.
            </h2>
            
            <p class="text-gray-400 text-lg md:text-xl mb-10 max-w-lg leading-relaxed">
                Parece que la página que buscas no existe o ha sido movida. Pero no te preocupes, en <strong>EQB Studio</strong> siempre encontramos una solución creativa.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                <!-- Website Button -->
                <a href="https://eqbstudio.vercel.app" target="_blank" rel="noopener noreferrer" 
                   class="btn-glow transition-all-custom flex items-center justify-center gap-3 bg-eqb-orange text-white px-8 py-4 rounded-full font-bold text-lg">
                    <i class="fa-solid fa-globe text-xl"></i>
                    Volver a la Web
                </a>
                
                <!-- Social Buttons Container -->
                <div class="flex gap-4 justify-center">
                    <!-- Instagram Button -->
                    <a href="https://instagram.com/eqbstudio" target="_blank" rel="noopener noreferrer"
                       class="btn-glow transition-all-custom flex items-center justify-center bg-[#1A1A1A] hover:bg-gradient-to-br hover:from-purple-600 hover:via-pink-500 hover:to-orange-500 text-white w-14 sm:w-16 h-14 sm:h-16 rounded-full text-2xl border border-gray-800">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    
                    <!-- WhatsApp Button -->
                    <a href="https://api.whatsapp.com/send?phone=573021192800" target="_blank" rel="noopener noreferrer"
                       class="btn-glow transition-all-custom flex items-center justify-center bg-[#1A1A1A] hover:bg-[#25D366] text-white w-14 sm:w-16 h-14 sm:h-16 rounded-full text-2xl border border-gray-800">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Right Side: Mascot Image -->
        <div class="flex-1 flex flex-col items-center justify-center relative w-full max-w-md lg:max-w-xl mascot-container" onclick="toggleMascot()">
            <!-- Hint badge -->
            <div class="absolute -top-6 bg-gray-800 text-eqb-orange px-4 py-1.5 rounded-full text-sm font-bold border border-gray-700 animate-hint z-20 flex items-center gap-2">
                <i class="fa-solid fa-hand-pointer"></i> ¡Hazme clic!
            </div>
            
            <!-- Mascot Image -->
            <img id="mascot-image" 
                 src="https://www.image2url.com/r2/default/images/1785201879269-cc23f276-17db-4a0a-b7fb-3c24e371d85b.png" 
                 alt="Zorro EQB Studio" 
                 class="w-full h-auto object-contain animate-float drop-shadow-2xl rounded-3xl">
        </div>
        
    </main>

    <script>
        // --- Mascot Interactivity ---
        const mascotImage = document.getElementById('mascot-image');
        let isChilling = true;

        // Toggle mascot image
        function toggleMascot() {
            // Add a quick pop animation
            mascotImage.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                if (isChilling) {
                    mascotImage.src = 'https://www.image2url.com/r2/default/images/1785201948750-0a62e402-6462-48a1-b786-60c4450667a6.png';
                } else {
                    mascotImage.src = 'https://www.image2url.com/r2/default/images/1785201879269-cc23f276-17db-4a0a-b7fb-3c24e371d85b.png';
                }
                isChilling = !isChilling;
                mascotImage.style.transform = 'scale(1)';
            }, 150);
        }

        // --- Parallax Effect for 404 Text ---
        document.addEventListener('mousemove', (e) => {
            const parallaxText = document.getElementById('parallax-text');
            const x = (window.innerWidth - e.pageX * 2) / 90;
            const y = (window.innerHeight - e.pageY * 2) / 90;
            
            parallaxText.style.transform = `translate(${x}px, ${y}px)`;
        });

        // --- Interactive Particle Background ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                // Reset position when particle goes off screen
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                // Using EQB Orange color for particles
                ctx.fillStyle = `rgba(255, 100, 0, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            // Number of particles based on screen width
            const numParticles = Math.floor(window.innerWidth / 15);
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animateParticles);
        }

        // Event Listeners for Canvas
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        // Initialize
        resize();
        initParticles();
        animateParticles();
    </script>
</body>
</html>
